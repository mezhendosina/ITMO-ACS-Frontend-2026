<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — Ложка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="navbar">
      <div class="container py-2">
        <a class="navbar-brand" href="index.html"
          ><span class="brand-mark">Л</span>Ложка</a
        ><a class="btn btn-outline-primary" href="register.html"
          >Создать аккаунт</a
        >
      </div>
    </nav>
    <main class="auth-page">
      <div class="container">
        <div class="row align-items-center g-5">
          <div class="col-lg-6 d-none d-lg-block">
            <div class="auth-art"></div>
          </div>
          <div class="col-lg-6">
            <section class="paper-card auth-card mx-auto">
              <span class="eyebrow">С возвращением</span>
              <h1 class="section-title mt-2 mb-3">Войдите на кухню</h1>
              <p class="text-muted mb-4">
                Ваши рецепты, подписки и подборки уже ждут.
              </p>
              <form
                class="needs-validation"
                novalidate
                data-success="Вы успешно вошли"
              >
                <div class="mb-3">
                  <label class="form-label" for="email">Электронная почта</label
                  ><input
                    class="form-control"
                    id="email"
                    type="email"
                    placeholder="name@example.com"
                    required
                  />
                  <div class="invalid-feedback">Введите корректный адрес.</div>
                </div>
                <div class="mb-3">
                  <div class="d-flex justify-content-between">
                    <label class="form-label" for="password">Пароль</label
                    ><a href="#" class="small">Забыли пароль?</a>
                  </div>
                  <input
                    class="form-control"
                    id="password"
                    type="password"
                    minlength="6"
                    required
                  />
                  <div class="invalid-feedback">Не менее 6 символов.</div>
                </div>
                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    id="remember"
                    type="checkbox"
                  /><label class="form-check-label" for="remember"
                    >Запомнить меня</label
                  >
                </div>
                <button class="btn btn-primary w-100" type="submit">
                  Войти
                </button>
              </form>
              <div class="text-center text-muted my-4">или</div>
              <button class="btn btn-outline-dark w-100" type="button">
                <i class="bi bi-google me-2"></i>Продолжить с Google
              </button>
              <p class="text-center mt-4 mb-0">
                Впервые здесь?
                <a href="register.html" class="fw-bold">Зарегистрироваться</a>
              </p>
            </section>
          </div>
        </div>
      </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="liveToast" class="toast">
        <div class="toast-body"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
