<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация — Ложка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body data-page="register">
    <nav class="navbar">
      <div class="container py-2">
        <a class="navbar-brand" href="index.html"
          ><span class="brand-mark">Л</span>Ложка</a
        ><a class="btn btn-outline-primary" href="login.html"
          >Уже есть аккаунт</a
        >
      </div>
    </nav>
    <main class="auth-page">
      <div class="container">
        <div class="row align-items-center g-5">
          <div class="col-lg-6">
            <section class="paper-card auth-card mx-auto">
              <span class="eyebrow">Присоединяйтесь</span>
              <h1 class="section-title mt-2 mb-3">Создайте аккаунт</h1>
              <p class="text-muted mb-4">
                Аккаунт будет создан через защищённый маршрут API.
              </p>
              <form class="needs-validation" novalidate data-register-form>
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label" for="name">Имя</label
                    ><input
                      class="form-control"
                      id="name"
                      name="name"
                      required
                    />
                    <div class="invalid-feedback">Укажите имя.</div>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label" for="surname">Фамилия</label
                    ><input
                      class="form-control"
                      id="surname"
                      name="surname"
                      required
                    />
                    <div class="invalid-feedback">Укажите фамилию.</div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="reg-email"
                      >Электронная почта</label
                    ><input
                      class="form-control"
                      id="reg-email"
                      name="email"
                      type="email"
                      required
                    />
                    <div class="invalid-feedback">
                      Введите корректный адрес.
                    </div>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="reg-password">Пароль</label
                    ><input
                      class="form-control"
                      id="reg-password"
                      name="password"
                      type="password"
                      minlength="8"
                      required
                    />
                    <div class="invalid-feedback">Не менее 8 символов.</div>
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        id="terms"
                        type="checkbox"
                        required
                      /><label class="form-check-label" for="terms"
                        >Я принимаю правила сообщества</label
                      >
                      <div class="invalid-feedback">Необходимо согласие.</div>
                    </div>
                  </div>
                  <div class="col-12">
                    <button class="btn btn-primary w-100" type="submit">
                      Создать аккаунт
                    </button>
                  </div>
                </div>
              </form>
            </section>
          </div>
          <div class="col-lg-6 d-none d-lg-block">
            <div class="auth-art"></div>
          </div>
        </div>
      </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="liveToast" class="toast"><div class="toast-body"></div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
