<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Поиск рецептов — Ложка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body data-page="search">
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container py-2">
        <a class="navbar-brand" href="index.html"
          ><span class="brand-mark">Л</span>Ложка</a
        ><button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
          aria-label="Открыть меню"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav mx-auto gap-lg-3">
            <li><a class="nav-link active" href="search.html">Рецепты</a></li>
            <li><a class="nav-link" href="community.html">Сообщество</a></li>
            <li><a class="nav-link" href="profile.html">Моя кухня</a></li>
          </ul>
          <a class="btn btn-primary" href="profile.html">Профиль</a>
        </div>
      </div>
    </nav>
    <header class="page-hero">
      <div class="container">
        <span class="eyebrow">Каталог из API</span>
        <h1 class="section-title mt-2">Найдите свой рецепт</h1>
        <p class="lead mb-0">По названию, ингредиентам, сложности и времени.</p>
      </div>
    </header>
    <main class="section-pad">
      <div class="container">
        <div class="row g-4">
          <aside class="col-lg-3">
            <div class="paper-card filter-panel">
              <h2 class="h4 mb-4">Фильтры</h2>
              <div class="mb-3">
                <label class="form-label" for="type">Тип блюда</label
                ><select class="form-select" id="type" name="type" data-filter>
                  <option value="">Все блюда</option>
                  <option value="breakfast">Завтраки</option>
                  <option value="main">Основные</option>
                  <option value="dessert">Десерты</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" for="difficulty">Сложность</label
                ><select
                  class="form-select"
                  id="difficulty"
                  name="difficulty"
                  data-filter
                >
                  <option value="">Любая</option>
                  <option value="easy">Легко</option>
                  <option value="medium">Средне</option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label" for="time">Время</label
                ><select class="form-select" id="time" name="time" data-filter>
                  <option value="">Любое</option>
                  <option value="20">До 20 минут</option>
                  <option value="40">До 40 минут</option>
                  <option value="60">До часа</option>
                </select>
              </div>
              <button
                class="btn btn-outline-primary w-100"
                type="button"
                data-reset
              >
                Сбросить
              </button>
            </div>
          </aside>
          <section class="col-lg-9">
            <div
              class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4"
            >
              <div class="search-shell d-flex flex-grow-1">
                <i class="bi bi-search ms-2 align-self-center"></i
                ><label class="visually-hidden" for="catalog-search"
                  >Поиск</label
                ><input
                  id="catalog-search"
                  class="form-control"
                  data-search
                  placeholder="Например, паста или томаты"
                />
              </div>
              <strong data-result-count>Загрузка…</strong>
            </div>
            <div class="row g-4" data-catalog></div>
          </section>
        </div>
      </div>
    </main>
    <footer class="py-4">
      <div class="container d-flex justify-content-between">
        <span>© 2026 Ложка · ЛР2</span><a href="index.html">На главную</a>
      </div>
    </footer>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="liveToast" class="toast"><div class="toast-body"></div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
